// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:11.2.3'
        // Supplies the `google-services` plugin, which reads app/google-services.json and
        // generates the Firebase/Google resource values at build time.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.jetbrains.kotlin.android) apply false
}
