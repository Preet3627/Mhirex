plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

apply plugin: 'com.mikepenz.aboutlibraries.plugin'

// Google Services / Firebase.
//
// Requires app/google-services.json to exist, which is gitignored and therefore absent from a clean
// checkout. The plugin fails the build when the file is missing, so it is applied conditionally: CI
// and any contributor without Firebase credentials still get a working build, and Sign-In reports a
// clear "not configured" state at runtime instead of a build break.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

aboutLibraries {
    excludeFields = ["generated"]
}

android {
    namespace 'com.mhirex.editor'
    compileSdk 34

    androidResources {
        generateLocaleConfig = true
    }

    lint {
        disable 'UseAppTint', 'MissingTranslation', 'ExtraTranslation'
    }

    defaultConfig {
        applicationId "com.mhirex.editor"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 10
        versionName "1.0-beta8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    applicationVariants.all { variant ->
        def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86_64': 2]

        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null && abiCodes.containsKey(abi)) {
                output.versionCodeOverride = variant.versionCode + abiCodes.get(abi)
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation("com.antonkarpenko:ffmpeg-kit-full-gpl:2.1.0")

    // Declared explicitly rather than inherited transitively.
    //
    // Coroutines reached this module only by accident, via androidx.lifecycle. The app leans on it
    // heavily (Dispatchers, CoroutineScope, Job, withContext, CancellationException) across the
    // editor, the export service and the proxy service, so "some other library happens to bring it
    // in" is load-bearing and fragile: bump lifecycle off coroutines, or have ffmpeg-kit stop
    // depending on it, and compilation breaks for a reason unrelated to the code that changed.
    //
    // 1.8.1 is the version already resolving today, so pinning it explicitly is a no-op
    // behaviourally and only makes the existing contract explicit.
    implementation(platform("org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.8.1"))
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android'

    // Google Sign-In via Credential Manager.
    //
    // The legacy `play-services-auth` GoogleSignInClient API is deprecated; Credential Manager is the
    // supported path and is what the AndroidX migration guide prescribes. `googleid` provides the
    // Google identity provider that the credential manager resolves against.
    //
    // These need an OAuth 2.0 *web* client ID registered for com.mhirex.editor. A Firebase
    // `google-services.json` alone is NOT sufficient: it carries only the API key and app ID, whereas
    // the web client ID (`*.apps.googleusercontent.com`) is what actually authorises the ID token.
    // The client ID is injected as a string resource so it can be swapped per build flavour without
    // touching Kotlin -- see res/values/google_sign_in.xml.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.airbnb.android:lottie:3.4.0'
    implementation "com.mikepenz:aboutlibraries-core:11.2.3"
    implementation "com.mikepenz:aboutlibraries:11.2.3"
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'com.google.code.gson:gson:2.10.1'
}
