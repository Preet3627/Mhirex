name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches app versionName
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(sed -nE 's/.*versionName[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$app_version" ]; then
            echo "Could not parse versionName from app/build.gradle" >&2
            exit 1
          fi
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=> $tag_version) does not match app versionName ($app_version)" >&2
            exit 1
          fi
          echo "Tag matches versionName: $app_version"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Write google-services.json for the Sign-In build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The file is gitignored, so a clean checkout never has it and the Google Services
          # plugin is skipped, which leaves Credential Manager with no client ID to authorise an
          # ID token against. The app still runs in that state ("not configured"), but Sign-In
          # cannot work, so inject the config from a secret when one is present.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from secret"
          else
            echo "GOOGLE_SERVICES_JSON is not set: building without Firebase config." >&2
            echo "Sign-In will report 'not configured' at runtime. Everything else is unaffected." >&2
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: r0adkll/sign-android-release@v1
        id: sign
        env:
          BUILD_TOOLS_VERSION: '34.0.0'
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Rename signed APKs
        run: |
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/app-*-release-unsigned-signed.apk; do
            [ -f "$apk" ] || continue
            name=$(basename "$apk")
            arch=$(printf '%s' "$name" | sed -E 's/^app-(.+)-release-unsigned-signed\.apk$/\1/')
            cp "$apk" "release-artifacts/Mhirex-${arch}.apk"
          done
          ls -lh release-artifacts/
      - name: Require release notes for this tag
        if: github.ref_type == 'tag'
        run: |
          # The release body comes from docs/releases/<tag>.md, the tracked copy of the notes.
          # Without this guard a typo in the tag would still publish a release with an empty body,
          # and the only symptom would be a blank page for readers.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "No release notes at $notes" >&2
            echo "Write them before tagging; the release body is taken from that file." >&2
            exit 1
          fi
          echo "Release notes: $notes ($(wc -c < "$notes") bytes)"
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: release-artifacts/*.apk
          body_path: docs/releases/${{ github.ref_name }}.md
          # Every tag so far is a beta, and the action defaults this to false, which would publish
          # the build as a full release and contradict its own notes. Flip to false when a stable
          # tag is cut.
          prerelease: true
